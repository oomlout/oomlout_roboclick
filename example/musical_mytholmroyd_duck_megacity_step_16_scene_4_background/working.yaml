oomlout_ai_roboclick_1:
    actions:
    -   command: create_text_file
        content: '# This Scene

            scene_id: scene_4

            work_focus: background


            Write the background image prompt for this scene only. Find its

            canonical background description in image_visual_guide.md and its

            prop placements in staging_guide.json (match scene_id).

            The BACKGROUND prompt is a normal opaque stage backdrop. Props are

            handled separately by step_17, so do not describe prop cut-outs here.

            Write the prompt only - the image itself is generated later by step_1000.

            '
        file_name: this_scene.md
    -   command: create_zip
        files: &id001
        -   arcname: settings_basic.yaml
            source: ../../source/settings_basic.yaml
        -   arcname: show_config.yaml
            source: ../../parts/musical_mytholmroyd_duck_megacity_step_03_canon_1/show_config.yaml
        -   arcname: image_visual_guide.md
            source: ../../parts/musical_mytholmroyd_duck_megacity_step_15_image_director_1/image_visual_guide.md
        -   arcname: staging_guide.md
            source: ../../parts/musical_mytholmroyd_duck_megacity_step_11_stage_director_1/staging_guide.md
        -   arcname: staging_guide.json
            source: ../../parts/musical_mytholmroyd_duck_megacity_step_11_stage_director_1/staging_guide.json
        -   arcname: scene_direction.md
            source: ../../parts/musical_mytholmroyd_duck_megacity_step_05_director_1/scene_direction_S04.md
        -   arcname: this_scene.md
            source: this_scene.md
        -   arcname: song_guidance.md
            source: ../../parts/musical_mytholmroyd_duck_megacity_step_06_music_director_1/song_guidance_N04.md
        -   arcname: song_lyrics.md
            source: ../../parts/musical_mytholmroyd_duck_megacity_step_07a_song_N04_final/lyrics.md
        zip_path: upload.zip
    -   command: create_text_file
        content: "step_id: step_16_scene_4_background\nstep_name: Scene Background\
            \ Image Prompt scene_4\ndescription: Background image prompt for scene_4.\n\
            files:\n  - name: image_prompt.md\n    destination: production/08b_scenes/scene_4/image_prompt.md\n\
            \    description: Complete background image prompt - full style block\
            \ plus all content details\n"
        file_name: file_creation_list.md
    -   command: create_text_file
        content: "step_id: step_16_scene_4_background\nstep_name: Scene Background\
            \ Image Prompt scene_4\ndescription: Background image prompt for scene_4.\n\
            files:\n  - name: image_prompt.md\n    destination: production/08b_scenes/scene_4/image_prompt.md\n\
            \    description: Complete background image prompt - full style block\
            \ plus all content details\n"
        file_name: file_creation_list.yaml
    file_test: ''
    retries_until_complete: 0
