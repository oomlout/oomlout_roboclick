oomlout_ai_roboclick_1:
    actions:
    -   command: new_chat
        description: type research
    -   command: query
        delay: 600
        text: "create a researched shortlist for Stat Clash (Top/ Trumps style): using\
            \ web browsing, pick 30 distinct and well-known shenzhen_metro_line_01_station\
            \ entries (or subtypes/categories of Shenzhen Metro Line 1 stations if\
            \ broader variety helps), verify each is a legitimate, good-fit topic\
            \ with at least 2 credible sources, prefer \u201Ccomplete list\u201D sources\
            \ (e.g., Wikipedia list pages) when they exist to ensure coverage, then\
            \ output (1) the final numbered list, (2) a 1-2 sentence \u201Cwhy it''s\
            \ fun/interesting\u201D hook per entry, and (3) the sources used per entry;\
            \ enforce variety (no near-duplicates), avoid obscure items unless they\
            \ add unique gameplay/stat potential, and if the chosen set seems weak\
            \ propose a better alternative set before finalizing;  Also design the\
            \ set for game balance: this is a Top Trumps style game where a player\
            \ picks one stat and the higher value wins, so every entry must be a SPECIALIST,\
            \ not good at everything. Using only these stat categories (connections,\
            \ journey_reach, station_scale, urban_energy, heritage), give each entry\
            \ exactly 2 STRONG categories (it clearly excels at these) and 2 WEAK\
            \ categories (it is clearly poor at these); any others are middling. Spread\
            \ the strong and weak categories as EVENLY as possible across the whole\
            \ list so each category is the strength of about the same number of entries\
            \ and the weakness of about the same number - never let most entries be\
            \ strong in the same category. Prefer entries whose real nature genuinely\
            \ fits their assigned strong categories."
    -   command: query
        delay: 300
        text: 'Convert the provided list of Stat Clash entries into ASCII-only YAML
            that matches this exact schema per card: name, name_proper, description,
            card_writeup, description_proper, region, category; do not add extra nicknames
            or bracketed aliases in name fields; output YAML with a top-level key
            cards containing a simple list (not a dict/map); wrap the entire YAML
            output between &&&tag for copy&&& and &&&tag for copy&&&; make description
            fun and zippy and 120 characters including spaces (hard max 130); make
            card_writeup one punchy, personality-rich sentence of 55 to 84 characters
            that works as printed card copy; use only ASCII-safe characters and standard
            keyboard punctuation, with no new lines in description or card_writeup.
            take all the time you need. Also add, per card, the balance profile you
            assigned: fields strong_1, strong_2, weak_1, weak_2, each set to one of
            the exact category names (connections, journey_reach, station_scale, urban_energy,
            heritage) with no repeats within a card; keep the strengths and weaknesses
            spread evenly across the whole list.'
    -   clip: '&&&tag for copy&&&'
        command: ai_save_text
        file_name_clip: card_details.yaml
        file_name_full: full_text.txt
    -   command: verify_structured
        file_name: card_details.yaml
        mode_ai_wait: slow
        repair: true
        retries: 2
    -   command: ai_fix_yaml_copy_paste
        file_input: card_details.yaml
        file_output: card_details_manual.yaml
        new_item_name: name
        remove_top_level:
        - cards
    -   command: verify_structured
        file_name: card_details_manual.yaml
        mode_ai_wait: slow
        repair: true
        retries: 2
    -   command: close_tab
    file_test: card_details_manual.yaml
