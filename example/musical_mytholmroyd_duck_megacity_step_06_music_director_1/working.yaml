oomlout_ai_roboclick_10:
    actions:
    -   command: wait_for_file
        file_name: upload.zip
        timeout: 0
    -   command: delay
        delay: 45.0
        message: '[pacing] before AI block song_guidance_N08'
        mode_scroll_lock_skip: true
        mode_skip_key: true
        rand: 30
    -   command: new_chat
        description: "Song guidance N08 \u2014 step 06"
    -   command: add_file
        file_name: upload.zip
    -   command: add_file
        file_name: musical_style_guide.md
    -   action_root: prompts/step_06_song_guidance
        command: ai_query
        delay: 300
        text: "You are the Music Director of a stage musical, writing the refined\n\
            guidance document for ONE song: song N08. All show details\nare in the\
            \ attached files -- do not use prior knowledge or memory\nabout any show.\
            \ Base everything only on these documents.\n\nAttached:\n- upload.zip:\
            \ the show documents -- settings_basic.yaml (base_song_style\n  is the\
            \ binding style baseline), show_config.yaml, canon_bible.md,\n  character_bible.md,\
            \ character_voices.md, character_registry.json,\n  character_assets/<character_id>/suno_voice_description.yaml,\n\
            \  beat_sheet.md, act_structure.md, scene_list.csv, song_list.csv,\n \
            \ scene_song_ledger.md (the binding pacing contract),\n  direction_guide.md,\
            \ and scene_direction/ (the director's per-scene\n  briefs).\n- musical_style_guide.md:\
            \ the show's finished musical style guide.\n  This is YOUR OWN style guide\
            \ -- treat every motif, vocal lock,\n  distinctness call, and \"never\
            \ do\" rule in it as binding.\n\nTHE SHOW IS SUNG-THROUGH: each scene\
            \ has only\n2 to 4 spoken lines\nbefore its song, so the song carries\
            \ ALL of the scene's storytelling.\nYour guidance must hand the songwriter\
            \ the concrete story events the\nsong must narrate, not just a mood.\n\
            \nWrite the refined guidance document for song N08 only.\n\nUse song_list.csv\
            \ to find the row whose song_number is exactly\nN08. Do not write guidance\
            \ for any other song. The total song\ncount for this run is base_length\
            \ from settings_basic.yaml: 10.\nIf any source or foundation note implies\
            \ a different approximate count,\nignore it for output-count purposes;\
            \ settings_basic.yaml controls the\nnumber of song guidance documents.\n\
            \nCross-reference scene_song_ledger.md and the matching scene_direction\n\
            document before writing. The ledger is binding: this song gets one\nprincipal\
            \ story turn, and any extra turn named in \"Do not also\" must\nstay out\
            \ of the guidance.\n\nDistinctness is binding too: musical_style_guide.md\
            \ decides what keeps\nthis song sonically its own (its rhythmic family,\
            \ tempo territory,\ntexture, and hook type). Lead with those song-specific\
            \ qualities;\nthe shared show genre is the backdrop, not the headline.\n\
            \nWrite the document between &&&guidance_N08&&& tags.\n\n&&&guidance_N08&&&\n\
            ## Song N08 - [Chosen Working Title]\nA working title you are proposing.\
            \ Not final, but evocative of the song's core.\n\n## Dramatic Mission\n\
            What this song must accomplish in the story. One tight paragraph.\nStart\
            \ from scene_song_ledger.md, the director's scene brief, and the\nmatching\
            \ song_list.csv row: what single principal turn does this song\nland,\
            \ what emotional state does the audience arrive in, what concrete\nstory\
            \ events must the song narrate, and where must they be when the\nlast\
            \ note lands?\n\n## Pacing Guardrail\nName the adjacent setup or payoff\
            \ that must be protected so this song\nhas room to breathe. Then name\
            \ the tempting extra turn this song must\nnot try to land.\n\n## Singer\
            \ and Voice\nWho sings it. Use cast members from character_registry.json\
            \ only; never\ninvent a new or unnamed character. Use canonical character_id\
            \ values.\nExplain their character state at this moment and what their\
            \ musical voice\nspecifically needs to sound like here, drawn from character_voices.md\
            \ and\nyour musical style analysis.\n\nAlso include a \"Suno vocal lock\"\
            \ line for every singer in this song.\nCopy the description value from\n\
            character_assets/<character_id>/suno_voice_description.yaml VERBATIM and\n\
            confirm it matches musical_style_guide.md's \"Singer Vocal Locks for\n\
            Suno\" section. Never adapt or freshly describe it. Include the exact\n\
            display_name from the YAML. These values are binding for step_07's Suno\n\
            style text and for the voice tag before every Suno lyric section.\n\n\
            Also state this song's PERSONA: the persona_name of the dominant\nsinger\
            \ from their suno_voice_description.yaml, which the producer\nselects\
            \ in Custom Mode so this character sounds like the same singer\nas in\
            \ their other numbers. Write \"ensemble - no single Persona\" if no\n\
            one singer dominates. And name the LEAD: only the lead singer's voice\n\
            description (plus at most one other) belongs in the Style field.\nCramming\
            \ three or more voice descriptions into one Style field\ndilutes all of\
            \ them and is why ensemble numbers come back sounding\nlike one generic\
            \ singer.\n\n## Musical Direction\nInstrumentation, tempo, feel, and harmonic\
            \ character, drawn from and\nconsistent with musical_style_guide.md and\
            \ the base_song_style in\nsettings_basic.yaml. Be specific enough that\
            \ a composer can hear it before\nwriting a note. State how the singer\
            \ vocal lock should sit against the\ntrack: lead, duet, call-and-response,\
            \ or ensemble layer. Do not invent\nany voices outside character_registry.json.\
            \ The audio generator sings\neach song section in a single voice, so plan\
            \ any duet, exchange, or\ncall-and-response as alternating whole sections\
            \ -- one singer per\nsection -- never as voices trading lines inside one\
            \ section.\n\n## Structural Shape\nHow the song is built: proposed structure,\
            \ where the emotional peak\nfalls, and how it resolves or deliberately\
            \ withholds resolution. The\nshape must make the principal turn appreciable,\
            \ not rush through a\nlist of plot points.\n\nNAME EVERY SECTION FROM\
            \ THE AUDIO GENERATOR'S CANONICAL VOCABULARY:\nIntro, Verse, Pre-Chorus,\
            \ Chorus, Post-Chorus, Refrain, Hook, Bridge,\nBreak, Instrumental Break,\
            \ Drop, Outro, End - with a number or letter\nsuffix where useful (Verse\
            \ 1, Verse 2a, Chorus 2). The generator only\nrecognises structure tags\
            \ it was trained on, so an evocative label\nlike \"Test Sequence A\",\
            \ \"Discovery Build\" or \"Open Button\" is not read\nas structure at\
            \ all and the section's shape is left to chance. Put the\nevocative naming\
            \ in your prose description of each section, never in\nthe section's label.\n\
            \nAssign every proposed section to exactly one singer (or the full\nensemble\
            \ singing together); if singers must trade or interrupt, shape\nthat as\
            \ short alternating sections rather than voice changes inside a\nsection.\
            \ Keep sections SHORT (four to eight lines) in any song with\nmore than\
            \ one singer - the generator holds a voice well across a short\nsection\
            \ and drifts across a long one, and it is least reliable exactly\nwhere\
            \ singers alternate.\n\nThe last section ends the SONG, not the scene:\
            \ any canonical label may\nclose it. See \"How This Song Ends\" below.\n\
            \n## Lyric Direction\nThe show is sung-through, so start with the concrete\
            \ story events this\nsong must narrate from the director's scene brief.\
            \ Then cover the central\nimage or idea, the world the characters inhabit,\
            \ the language register\nthat fits this character and moment, and what\
            \ the lyrics must not do.\nWhatever the register, the baseline for every\
            \ song is plain, concrete,\nspoken language a listener follows on one\
            \ sung hearing: direct the\nsongwriter toward saying who does what, and\
            \ away from dense imagery,\ninverted phrasing, or rhyme-first wording.\
            \ Clarity outranks cleverness.\n\n## How This Song Ends\nThe song does\
            \ NOT carry the hand-off to the next scene. Each scene has\nspoken lines\
            \ after the song, and those lines take the audience into\nwhat comes next.\
            \ A song that also announces it makes the audience hear\nthe same hand-off\
            \ twice, which is why the sung version was removed.\n\nBrief the ending\
            \ as a MUSICAL and EMOTIONAL one:\n- The arrival point: the state this\
            \ song's principal turn leaves the\n  singer in, once the turn has landed.\
            \ That is what the final section\n  expresses.\n- How the arrangement\
            \ ends: full close, sudden stop, fade, held\n  chord, a return of the\
            \ opening figure -- whatever suits the turn.\n  The song may end open\
            \ or closed musically; what it must not do is\n  end by TELLING the audience\
            \ where the character is going.\n- What the final section must not contain:\
            \ the next action, the next\n  location, the next person, prophecy, motto,\
            \ a description of the\n  finished future, or a summary of the song just\
