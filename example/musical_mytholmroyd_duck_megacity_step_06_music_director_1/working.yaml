base_illustration_style: "fun chibi vector illustration with simple bold colours;\
    \ simple, uncluttered compositions favouring intimate shots of characters talking\
    \ to one another over wide detailed vistas; modern structures (metro stations,\
    \ tunnels, trains, the finished city's towers) are clean-cut contemporary MTR/HDB\
    \ style with NO historical sandstone or brickwork; the metro is always double-stacked;\
    \ scenes 1-8 all sit in ONE consistent season \u2014 late spring/summer \u2014\
    \ and scene 10 opens on a new dawn mirroring scene 1's canal bank at dawn; the\
    \ plan is never drawn as a recurring object (no consistent plan drawing/model/poster\
    \ carried across scenes)"
base_length: 10
base_music_palette: "modern driving pop/electronic \u2014 beats, synths, momentum;\
    \ the sound of the metro itself. Vignette numbers (scenes 5-8) are character-flavoured\
    \ over that metro spine \u2014 e.g. Mabel canal-folk-tinged, Elsie gentler \u2014\
    \ with the electronic pulse kept underneath; the score's identity stays the metro\
    \ sound"
base_number_of_characters: 6
base_number_of_props: 2
base_show_shape: "sung-through \u2014 the story is carried in song with only a few\
    \ spoken dialogue lines to link numbers, spoken naturalistically by whoever is\
    \ in the scene (never a narrator); NAMED VOICES ONLY: every sung line belongs\
    \ to one of the 6 named characters \u2014 unnamed villagers/ensemble never sing;\
    \ 10 scenes on the producer-authored 10-beat spine (a-j), ~10 songs; duck-plus-one\
    \ staging \u2014 full company only at the meeting (scene 4) and scenes 9-10; scene\
    \ 10 is ONE sectioned mega-finale (train reveal \u2192 recognition \u2192 arc\
    \ landing \u2192 open button), never separate finale songs"
base_song_style: "modern driving pop/electronic \u2014 beats, synths, momentum; the\
    \ sound of the metro itself; vignette numbers (scenes 5-8) character-flavoured\
    \ over that spine (Mabel canal-folk-tinged, Elsie gentler) with the electronic\
    \ pulse kept underneath"
base_song_words_max: 500
base_story_name: mytholmroyd_duck_megacity
base_story_style: "an earnest, funny, momentum-filled community-transformation tale\
    \ on the producer-authored 10-beat spine (storybook: the same 10 beats in order\
    \ plus the two AUTHORED extra beats \u2014 the Mytholmroyd name-meaning discovery\
    \ ('clearing where two rivers meet') beside beat b, and a Yorkshire hawker-hall\
    \ family meal (Yorkshire puddings, curry, dim sum, parkin under one roof) beside\
    \ the finale \u2014 12 total): no villain, exactly ONE setback (the failed presentation,\
    \ beats c/d, witnessed as a flashback within scene 3) resolved by hearing concerns\
    \ one at a time in intimate duck-plus-one vignettes on their canon locations (canal\
    \ bank at dawn; the strip between river and canal; outside then inside the village\
    \ hall; a lock gate; Nora's lane; the station platform; Elsie's front room; the\
    \ locks drained one by one), everyone converting before the build, then lock-by-lock\
    \ construction (scene 9, the only construction scene) and a single triumphant\
    \ reveal held to scene 10 \u2014 opening on a new dawn that mirrors scene 1, the\
    \ first double-stacked train arriving with Asha Rahman aboard (in the storybook\
    \ this reveal is the book's one double-page spread) \u2014 that ends open-ended:\
    \ 'so much more to discover and become'. The whole tale sits in one late-spring/summer\
    \ season, and the 2015 flood is never referenced \u2014 no beat, lyric, or image"
