            \ section.\n\n## Structural Shape\nHow the song is built: proposed structure,\
            \ where the emotional peak\nfalls, and how it resolves or deliberately\
            \ withholds resolution. The\nshape must make the principal turn appreciable,\
            \ not rush through a\nlist of plot points.\n\nNAME EVERY SECTION FROM\
            \ THE AUDIO GENERATOR'S CANONICAL VOCABULARY:\nIntro, Verse, Pre-Chorus,\
            \ Chorus, Post-Chorus, Refrain, Hook, Bridge,\nBreak, Instrumental Break,\
