oomlout_ai_roboclick_1:
    actions:
    -   command: create_text_file
        content: '# This Character

            character_id: canal_duck

            character_name: Canal Duck

            character_number: 1

            asset_folder: production/08a_character_assets/character_1


            Write the character description, ElevenLabs voice prompt, Suno voice description
            YAML, image prompt, and character.yaml for this character only.

            Write character_description.md before image_prompt.md so the image prompt
            can be built from a stable description.

            Write elevenlabs_voice_prompt.md before image_prompt.md so the voice design
            lives beside the character asset.

            Write suno_voice_description.yaml once and keep its description compact
            enough to repeat verbatim in every Suno section tag.

            character.yaml must include short_name, aliases, and a quoted CSS hex
            color like "#00bcd4".

            Aliases should include common dialogue speaker forms such as first names.

            Use the binding foundation visual guardrails when defining their stable
            appearance.

