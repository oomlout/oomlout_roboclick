id: gemini_full_stream
enabled: false
name: Gemini Full Stream Test
directory: test/parts/gemini_full_stream
oomlout_ai_roboclick_1:
    actions:
    -   command: new_chat
        base_ai_provider: gemini
        description: Gemini full stream test
        log_url: true
    -   command: set_mode
        base_ai_provider: gemini
        mode: thinking
    -   command: ai_query
        base_ai_provider: gemini
        text: Write a haiku about robots.
        delay: '30'
        mode_ai_wait: slow
    -   command: save_text
        base_ai_provider: gemini
        file_name: gemini_haiku.txt
    -   command: close_tab
    file_test: gemini_haiku.txt
    retries_until_complete: 1
